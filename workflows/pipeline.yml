name: Pipeline CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar pasta de publicação
        run: |
          mkdir -p public
          cp index.html public/
          ls -l public

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public

  test:
    name: Testes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: public

      - name: Verificar se o index.html existe
        run: test -f public/index.html

      - name: Validar HTML com htmlhint
        run: npx --yes htmlhint@1 public/index.html

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Recuperar build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: public

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
